ories are for you.\",\"title\":\"Happy Birthday{,receiver}.\",\"subtitle\":\"Today, you deserve to be celebrated.\",\"next\":\"There's a letter for you →\"},\"letter\":{\"kicker\":\"A little letter\",\"body\":\"I'm not good with fancy words, so I'll keep it simple: happy birthday.\\n\\nThis past year can't have been easy, and yet here you are — you're stronger than you think.\\n\\nAll I wish is that you eat well, sleep enough, worry a little less, and remember that someone is always here when you need them.\",\"signature\":\"— {sender}\",\"next\":\"There's more →\"},\"final\":{\"kicker\":\"For you\",\"title\":\"Happy Birthday{,receiver}\",\"from\":\"from {sender}\",\"message\":\"May the wish you just picked really find its way to you this year.\",\"starButton\":\"Send the wish to the sky ✨\",\"repeatButton\":\"Start over from the beginning\"},\"starlight\":{\"kicker\":\"Up to the sky\",\"title\":\"Turn the wish into a shooting star\",\"subtitle\":\"Touch the star to send your wish up into the night sky.\",\"wishFallback\":\"Your wish\",\"sentTitle\":\"The wish has been sent ✨\",\"sentMessage\":\"They say a wish that rides a shooting star comes true sooner or later. From tonight on, there will always be a star up there keeping that wish for you.\",\"tapHint\":\"Touch the sky to let more shooting stars fall ✧\",\"backButton\":\"Back to the card\",\"repeatButton\":\"Start over from the beginning\"},\"ui\":{\"months\":[\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"],\"monthLabel\":\"{monthName}\",\"heartTapHint\":\"Touch the heart to see the photos ♡\",\"viewPhoto\":\"View photo\",\"tapToClose\":\"Tap to close\",\"languageLabel\":\"Language\"}},\"ko\":{\"senderName\":\"나\",\"receiverName\":\"너\",\"opening\":{\"greeting\":\"생일 축하해\",\"day\":17,\"month\":7},\"intro\":{\"line1\":\"너에게 줄 작은 선물이 있어…\",\"line2\":\"하지만 열기 전에, 먼저 촛불을 불어서 꺼줘 🎂\",\"idleHint\":\"👆 촛불을 꺼질 때까지 길게 눌러줘\",\"holdingHi
